<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家教信息筛选排序系统 · 架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Serif+SC:wght@400&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* 皮肤：与 Web UI 一致（台账蓝灰底 / 近黑墨 / 数据蓝唯一色相） */
      --color-paper:   #f2f4f7;
      --color-ink:     #0f1216;
      --color-muted:   #566170;
      --color-soft:    #757f8c;
      --color-accent:  #1d5fbf;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>家教信息筛选排序系统 — 架构</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
        <title id="arch-title">家教信息筛选排序系统 · 架构</title>
        <desc id="arch-desc">命令行、Web 界面与 Android 应用三个入口共用同一套核心流水线：读取 data/ 下三个数据文件，过滤计分排序后写入 res.txt。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#566170"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d5fbf"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f2f4f7"/>

        <!-- 分区（先于箭手与节点绘制） -->
        <g>
          <rect x="60" y="64" width="840" height="108" rx="8" fill="rgba(15,18,22,0.02)" stroke="rgba(15,18,22,0.10)" stroke-width="0.8"/>
          <rect x="76" y="68" width="84" height="12" rx="2" fill="#f2f4f7"/>
          <text x="118" y="77" fill="#757f8c" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ENTRY</text>

          <rect x="200" y="232" width="560" height="104" rx="8" fill="rgba(15,18,22,0.02)" stroke="rgba(15,18,22,0.10)" stroke-width="0.8"/>
          <rect x="216" y="236" width="76" height="12" rx="2" fill="#f2f4f7"/>
          <text x="254" y="245" fill="#757f8c" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CORE</text>

          <rect x="60" y="396" width="840" height="118" rx="8" fill="rgba(15,18,22,0.02)" stroke="rgba(15,18,22,0.10)" stroke-width="0.8"/>
          <rect x="76" y="400" width="76" height="12" rx="2" fill="#f2f4f7"/>
          <text x="114" y="409" fill="#757f8c" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">DATA</text>
        </g>

        <!-- 箭头（先画线，后画盒） -->
        <g>
          <!-- 命令行 → 核心 -->
          <path d="M 210,154 V 207 Q 210,215 218,215 H 382 Q 390,215 390,223 V 262" fill="none" stroke="#566170" stroke-width="1.2" marker-end="url(#arrow)"/>
          <rect x="284" y="195" width="32" height="12" rx="2" fill="#f2f4f7"/>
          <text x="300" y="204" fill="#757f8c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>

          <!-- Web 界面 → 核心 -->
          <path d="M 480,154 V 262" fill="none" stroke="#566170" stroke-width="1.2" marker-end="url(#arrow)"/>
          <rect x="492" y="196" width="32" height="12" rx="2" fill="#f2f4f7"/>
          <text x="508" y="205" fill="#757f8c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>

          <!-- Android 应用 → 核心（vendored 副本，虚线） -->
          <path d="M 750,154 V 207 Q 750,215 742,215 H 578 Q 570,215 570,223 V 262" fill="none" stroke="#566170" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect x="628" y="195" width="56" height="12" rx="2" fill="#f2f4f7"/>
          <text x="656" y="204" fill="#757f8c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VENDORED</text>

          <!-- 数据文件 → 核心（读取） -->
          <path d="M 390,462 H 432 Q 440,462 440,454 V 326" fill="none" stroke="#566170" stroke-width="1.2" marker-end="url(#arrow)"/>
          <rect x="450" y="380" width="36" height="12" rx="2" fill="#f2f4f7"/>
          <text x="468" y="389" fill="#757f8c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

          <!-- 核心 → 排序结果（写入，主线用 accent） -->
          <path d="M 560,322 V 376 Q 560,384 568,384 H 702 Q 710,384 710,392 V 430" fill="none" stroke="#1d5fbf" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
          <rect x="613" y="364" width="44" height="12" rx="2" fill="#f2f4f7"/>
          <text x="635" y="373" fill="#757f8c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>
        </g>

        <!-- 节点 -->
        <g font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
          <!-- 命令行 -->
          <rect x="110" y="98" width="200" height="56" rx="6" fill="#f2f4f7"/>
          <rect x="110" y="98" width="200" height="56" rx="6" fill="#ffffff" stroke="#0f1216" stroke-width="1"/>
          <rect x="118" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(15,18,22,0.40)" stroke-width="0.8"/>
          <text x="132" y="113" fill="rgba(15,18,22,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
          <text x="210" y="132" fill="#0f1216" font-size="12" font-weight="600" text-anchor="middle">命令行</text>
          <text x="210" y="146" fill="#566170" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">python -m tutorfilter</text>

          <!-- Web 界面 -->
          <rect x="380" y="98" width="200" height="56" rx="6" fill="#f2f4f7"/>
          <rect x="380" y="98" width="200" height="56" rx="6" fill="#ffffff" stroke="#0f1216" stroke-width="1"/>
          <rect x="388" y="104" width="36" height="12" rx="2" fill="transparent" stroke="rgba(15,18,22,0.40)" stroke-width="0.8"/>
          <text x="406" y="113" fill="rgba(15,18,22,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
          <text x="480" y="132" fill="#0f1216" font-size="12" font-weight="600" text-anchor="middle">Web 界面</text>
          <text x="480" y="146" fill="#566170" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">web/server.py :8000</text>

          <!-- Android 应用 -->
          <rect x="650" y="98" width="200" height="56" rx="6" fill="#f2f4f7"/>
          <rect x="650" y="98" width="200" height="56" rx="6" fill="#ffffff" stroke="#0f1216" stroke-width="1"/>
          <rect x="658" y="104" width="32" height="12" rx="2" fill="transparent" stroke="rgba(15,18,22,0.40)" stroke-width="0.8"/>
          <text x="674" y="113" fill="rgba(15,18,22,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APK</text>
          <text x="750" y="132" fill="#0f1216" font-size="12" font-weight="600" text-anchor="middle">Android 应用</text>
          <text x="750" y="146" fill="#566170" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">toga · briefcase</text>

          <!-- 核心流水线（焦点节点） -->
          <rect x="300" y="266" width="360" height="56" rx="6" fill="#f2f4f7"/>
          <rect x="300" y="266" width="360" height="56" rx="6" fill="rgba(29,95,191,0.08)" stroke="#1d5fbf" stroke-width="1"/>
          <rect x="308" y="272" width="36" height="12" rx="2" fill="transparent" stroke="rgba(29,95,191,0.50)" stroke-width="0.8"/>
          <text x="326" y="281" fill="rgba(29,95,191,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
          <text x="480" y="300" fill="#0f1216" font-size="13" font-weight="600" text-anchor="middle">核心流水线 · 解析 → 过滤 → 计分 → 排序</text>
          <text x="480" y="314" fill="#566170" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tutorfilter/core.py · storage.py</text>

          <!-- 数据文件 -->
          <rect x="110" y="434" width="280" height="56" rx="6" fill="#f2f4f7"/>
          <rect x="110" y="434" width="280" height="56" rx="6" fill="rgba(15,18,22,0.05)" stroke="#566170" stroke-width="1"/>
          <rect x="118" y="440" width="36" height="12" rx="2" fill="transparent" stroke="rgba(86,97,112,0.40)" stroke-width="0.8"/>
          <text x="136" y="449" fill="rgba(86,97,112,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
          <text x="250" y="468" fill="#0f1216" font-size="12" font-weight="600" text-anchor="middle">输入数据</text>
          <text x="250" y="482" fill="#566170" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Blocked_words · Personal_info · Tutor_info</text>

          <!-- 排序结果 -->
          <rect x="570" y="434" width="280" height="56" rx="6" fill="#f2f4f7"/>
          <rect x="570" y="434" width="280" height="56" rx="6" fill="rgba(15,18,22,0.05)" stroke="#566170" stroke-width="1"/>
          <rect x="578" y="440" width="28" height="12" rx="2" fill="transparent" stroke="rgba(86,97,112,0.40)" stroke-width="0.8"/>
          <text x="592" y="449" fill="rgba(86,97,112,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
          <text x="710" y="468" fill="#0f1216" font-size="12" font-weight="600" text-anchor="middle">排序结果</text>
          <text x="710" y="482" fill="#566170" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">data/res.txt</text>
        </g>

        <!-- 图例：底部横条 -->
        <g font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
          <line x1="30" y1="540" x2="930" y2="540" stroke="rgba(15,18,22,0.10)" stroke-width="0.8"/>
          <text x="30" y="560" fill="#566170" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

          <rect x="120" y="552" width="16" height="10" rx="2" fill="rgba(29,95,191,0.08)" stroke="#1d5fbf" stroke-width="1"/>
          <text x="144" y="561" fill="#566170" font-size="9">核心流水线（焦点）</text>

          <rect x="300" y="552" width="16" height="10" rx="2" fill="#ffffff" stroke="#0f1216" stroke-width="1"/>
          <text x="324" y="561" fill="#566170" font-size="9">入口程序</text>

          <rect x="440" y="552" width="16" height="10" rx="2" fill="rgba(15,18,22,0.05)" stroke="#566170" stroke-width="1"/>
          <text x="464" y="561" fill="#566170" font-size="9">数据文件</text>

          <line x1="580" y1="557" x2="616" y2="557" stroke="#566170" stroke-width="1" stroke-dasharray="5,4"/>
          <text x="624" y="561" fill="#566170" font-size="9">同步副本（Android 端 vendored）</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
